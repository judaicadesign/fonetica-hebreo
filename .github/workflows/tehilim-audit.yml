name: Audit Tehilim 150

on:
  push:
    paths:
      - index.html
      - scripts/audit-tehilim.mjs
      - scripts/extract-engine.mjs
      - scripts/run-regressions.mjs
      - tests/**
      - .github/workflows/tehilim-audit.yml
  workflow_dispatch:

concurrency:
  group: tehilim-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check scripts/audit-tehilim.mjs
      - name: Compare generator against live Tehilim 14 master
        run: node tests/psalm-14-live-audit.mjs
      - name: Snapshot exact generator output for ArtScroll 8–12
        run: node tests/artscroll-eight-twelve-audit.mjs
      - name: Regress final decisions and 126/137 review
        run: node tests/artscroll-126-137-20261011.mjs
      - name: Check phonetics and Nakdan behavior
        run: node scripts/run-regressions.mjs
      - name: Audit all Psalms
        if: ${{ !cancelled() }}
        run: node scripts/audit-tehilim.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tehilim-corpus-audit
          path: audit-results/
          if-no-files-found: ignore
