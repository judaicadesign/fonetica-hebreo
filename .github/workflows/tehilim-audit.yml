name: Audit Tehilim 150

on:
  push:
    paths:
      - index.html
      - scripts/audit-tehilim.mjs
      - scripts/extract-engine.mjs
      - tests/**
      - .github/workflows/tehilim-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check scripts/audit-tehilim.mjs
      - name: Check phonetics and Nakdan behavior
        run: |
          node tests/jasar-regression.mjs
          node tests/reverential-caps-regression.mjs
          node tests/tehilim-artscroll-five.mjs
          node tests/nakdan-workflow.mjs
      - name: Audit all Psalms
        run: node scripts/audit-tehilim.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tehilim-corpus-audit
          path: audit-results/
          if-no-files-found: ignore
